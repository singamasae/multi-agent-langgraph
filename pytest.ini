[pytest]
# Make the `app` package importable from src/ without installing it.
pythonpath = src
testpaths = tests
# Keep third-party deprecation noise (e.g. langchain-community sunset notice)
# from cluttering test output; our own code must stay warning-clean.
filterwarnings =
    ignore:.*langchain-community.*is being sunset.*:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
    ignore:.*config_schema.* is deprecated.*
